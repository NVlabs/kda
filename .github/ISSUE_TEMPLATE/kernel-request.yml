name: Discuss a kernel idea
description: Discuss a kernel need or get help preparing a wishlist request.
title: "[wishlist] "
labels:
  - wishlist
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this issue to discuss a kernel idea or get help preparing a request for Kernel Design Agents (KDA). Complete definitions, workloads, and benchmarks are optional here.

        If your files are ready, [submit a pull request directly to wishlist](https://github.com/NVlabs/kda/tree/wishlist#submit). You do not need to open an issue first or repeat the request details here.

  - type: input
    id: project
    attributes:
      label: Project and real-world impact
      description: Which project or workload needs this kernel, and who would benefit?
      placeholder: Project link or name and a short explanation of the use case
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Kernel idea and desired improvement
      description: What should the kernel compute? Describe the bottleneck or the help you need.
      placeholder: Describe the operation, what is slow or missing, and the improvement you hope for.
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Target hardware
      description: Currently, KDA only supports NVIDIA B200 and B300 GPUs. Select all targets that apply.
      multiple: true
      options:
        - NVIDIA B200
        - NVIDIA B300
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Available context (optional)
      description: Share any shapes, data types, constraints, code links, workloads, or measurements you already have. Leave this blank if you are still exploring the idea.
      placeholder: Existing implementation, example inputs, related discussion, or questions
    validations:
      required: false
